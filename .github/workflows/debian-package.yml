name: Build Debian WSL package

on:
  push:
    branches: [main]
    paths:
      - .github/actions/setup-nix/**
      - .github/workflows/debian-package.yml
      - bin/**
      - distro/**
      - environment.d/**
      - flake.lock
      - flake.nix
      - libexec/**
      - nix/**
      - pipewire/**
      - weaselwayd/**
      - LICENSE
  pull_request:
    paths:
      - .github/actions/setup-nix/**
      - .github/workflows/debian-package.yml
      - bin/**
      - distro/**
      - environment.d/**
      - flake.lock
      - flake.nix
      - libexec/**
      - nix/**
      - pipewire/**
      - weaselwayd/**
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dxgdrm:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Test Debian package helpers
        run: python3 -m unittest distro.test_debian

      - name: Build the multi-output WSL driver
        run: |
          nix build --print-build-logs --out-link dxgdrm .#dxgdrm-all
          tar -chzf dxgdrm-multi-output.tar.gz -C dxgdrm \
            lib/modules lib/udev/rules.d/99-dxgdrm.rules

      - uses: actions/upload-artifact@v7
        with:
          name: dxgdrm-multi-output
          path: dxgdrm-multi-output.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  package:
    needs: dxgdrm
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      DISTRO: Debian
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WSL_UTF8: 1
      MSYS_NO_PATHCONV: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dxgdrm-multi-output

      - name: Update WSL
        run: |
          for i in 1 2 3 4; do wsl --update --web-download && break; [ $i = 4 ] && exit 1; sleep $((i * 30)); done
          wsl --version

      - name: Install Debian 13
        run: |
          for i in 1 2 3 4; do wsl --install "${DISTRO}" --no-launch --web-download && break; [ $i = 4 ] && exit 1; sleep $((i * 30)); done
          wsl -d "${DISTRO}" -u root -- bash -euxs <<'EOF'
          apt-get update
          apt-get install -y sudo git python3
          cat > /etc/apt/sources.list.d/trixie-backports.sources <<'SOURCES'
          Types: deb deb-src
          URIs: http://deb.debian.org/debian
          Suites: trixie-backports
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          SOURCES
          useradd -m -s /bin/bash -G sudo ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ci
          cat > /etc/wsl.conf <<'WSL'
          [boot]
          systemd=true

          [user]
          default=ci
          WSL
          EOF
          wsl --terminate "${DISTRO}"

      - name: Build the Debian bundle
        run: |
          WIN_WORKSPACE="$(cygpath -w "${GITHUB_WORKSPACE}")"
          WSL_WORKSPACE="$(wsl -d "${DISTRO}" -- wslpath -u "${WIN_WORKSPACE}")"
          WSL_DRIVER="$(wsl -d "${DISTRO}" -- wslpath -u "${WIN_WORKSPACE}\\dxgdrm-multi-output.tar.gz")"
          wsl -d "${DISTRO}" --cd '~' -- env \
            SOURCE_REPOSITORY="${SOURCE_REPOSITORY}" \
            SOURCE_SHA="${SOURCE_SHA}" \
            WSL_WORKSPACE="${WSL_WORKSPACE}" \
            WSL_DRIVER="${WSL_DRIVER}" \
            bash -euxs <<'EOF'
          git clone --quiet "https://github.com/${SOURCE_REPOSITORY}.git" weaselway
          git -C weaselway checkout --quiet "${SOURCE_SHA}"
          cat > /etc/apt/sources.list.d/trixie-backports.sources <<'SOURCES'
          Types: deb deb-src
          URIs: http://deb.debian.org/debian
          Suites: trixie-backports
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          SOURCES
          ./weaselway/distro/install.py --desktop kde --no-flatpak --no-bluetooth \
            --quick-build --dxgdrm-archive "${WSL_DRIVER}"
          mkdir -p "$HOME/.cache/weaselway-build/packages"
          cd "$HOME/.cache/weaselway-build/packages"
          apt-get download libwayland-client0/trixie-backports
          cd "$HOME"
          python3 weaselway/distro/build-deb.py \
            --output "${WSL_WORKSPACE}/weaselway-debian13"
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: weaselway-debian13-${{ github.sha }}
          path: weaselway-debian13.tar.gz
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

name: Build Debian WSL package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debian-package.yml
      - bin/**
      - distro/**
      - environment.d/**
      - flake.lock
      - flake.nix
      - libexec/**
      - nix/**
      - pipewire/**
      - weaselwayd/**
      - LICENSE
  pull_request:
    paths:
      - .github/workflows/debian-package.yml
      - bin/**
      - distro/**
      - environment.d/**
      - flake.lock
      - flake.nix
      - libexec/**
      - nix/**
      - pipewire/**
      - weaselwayd/**
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Test Debian package helpers
        run: python3 -m unittest discover -s distro -p 'test_*.py'

      - name: Test the daemon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl-dev libgles-dev libgbm-dev libdrm-dev freerdp3-dev libwinpr3-dev \
            libglib2.0-dev libpng-dev libwayland-dev
          make -C weaselwayd check

  package:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      DISTRO: Debian
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WSL_UTF8: 1
      MSYS_NO_PATHCONV: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Update WSL
        run: |
          for i in 1 2 3 4; do wsl --update --web-download && break; [ $i = 4 ] && exit 1; sleep $((i * 30)); done
          wsl --version

      - name: Install Debian 13
        run: |
          for i in 1 2 3 4; do wsl --install "${DISTRO}" --no-launch --web-download && break; [ $i = 4 ] && exit 1; sleep $((i * 30)); done
          wsl -d "${DISTRO}" -u root -- bash -euxs <<'EOF'
          apt-get update
          apt-get install -y sudo git python3
          useradd -m -s /bin/bash -G sudo ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ci
          cat > /etc/wsl.conf <<'WSL'
          [boot]
          systemd=true

          [user]
          default=ci
          WSL
          EOF
          wsl --terminate "${DISTRO}"

      - name: Build the Debian bundle
        run: |
          WIN_WORKSPACE="$(cygpath -m "${GITHUB_WORKSPACE}")"
          WSL_WORKSPACE="$(wsl -d "${DISTRO}" -- wslpath -u "${WIN_WORKSPACE}")"
          wsl -d "${DISTRO}" --cd '~' -- env \
            SOURCE_REPOSITORY="${SOURCE_REPOSITORY}" \
            SOURCE_SHA="${SOURCE_SHA}" \
            WSL_WORKSPACE="${WSL_WORKSPACE}" \
            bash -euxs <<'EOF'
          git clone --quiet "https://github.com/${SOURCE_REPOSITORY}.git" weaselway
          git -C weaselway checkout --quiet "${SOURCE_SHA}"
          # KWin's parallel C++ compilation can exhaust the WSL VM's memory.
          # Keep the optimized build, but limit concurrency and log resources.
          (
            set +e
            while :; do
              echo "=== Build resources: $(date -u) ==="
              free -m
              df -h "$HOME"
              cat /proc/pressure/memory
              ps -eo state,pid,ppid,pcpu,pmem,rss,comm --sort=-rss | head -n 12
              sleep 120 >/dev/null 2>&1
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          ./weaselway/distro/install.py --desktop kde --no-flatpak --no-bluetooth --jobs 2
          kill "$monitor"
          wait "$monitor" 2>/dev/null || true
          trap - EXIT
          mkdir -p "$HOME/.cache/weaselway-build/packages"
          cd "$HOME/.cache/weaselway-build/packages"
          apt-get download libwayland-client0/trixie-backports
          cd "$HOME"
          python3 weaselway/distro/build-deb.py \
            --output "${WSL_WORKSPACE}/weaselway-debian13"
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: weaselway-debian13-${{ github.sha }}
          path: weaselway-debian13.tar.gz
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
